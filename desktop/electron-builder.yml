appId: com.coco-ai.desktop
productName: Coco AI 助手
copyright: Copyright © 2024 Coco Team

directories:
  output: release
  buildResources: resources

files:
  - dist-electron/**/*
  - dist-react/**/*
  - package.json

extraResources:
  - from: dist-backend/xiaozhushou-backend
    to: backend
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: ${productName}-${version}-Setup.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Coco AI 助手

mac:
  target:
    - target: dmg
      arch: [x64, arm64]
  icon: resources/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: resources/icon.png
  category: Utility

publish:
  provider: github
  owner: your-username
  repo: coco-ai-desktop
